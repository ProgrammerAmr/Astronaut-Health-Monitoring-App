name: Build Android App (APK)

# Manual build so the team can download an installable APK/AAB straight from
# GitHub without installing Flutter locally.
#
#   GitHub -> Actions -> "Build Android App (APK)" -> Run workflow
#     * backend_url : the OrbitCare API address baked into the app
#     * artifact    : apk-split (small, per CPU) / apk-universal / appbundle
#   When the run finishes, the download link is at the bottom of the run page
#   under "Artifacts".
#
# NOTE: GitHub only shows the "Run workflow" button once this file exists on the
#       default branch (main).

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL baked into the app (ORBITCARE_API_BASE_URL)"
        required: true
        default: "http://10.0.2.2:5000"
      artifact:
        description: "What to build"
        required: true
        default: "apk-split"
        type: choice
        options:
          - apk-split
          - apk-universal
          - appbundle
      flutter_channel:
        description: "Flutter channel"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.artifact }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android ${{ inputs.artifact }} (${{ inputs.backend_url }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          flutter doctor -v || true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Static analysis (fail before Gradle does)
        run: flutter analyze --no-fatal-infos

      - name: Build release artifact
        run: |
          case "${{ inputs.artifact }}" in
            apk-universal)
              flutter build apk --release \
                --dart-define=ORBITCARE_API_BASE_URL="${{ inputs.backend_url }}"
              ;;
            appbundle)
              flutter build appbundle --release \
                --dart-define=ORBITCARE_API_BASE_URL="${{ inputs.backend_url }}"
              ;;
            *)
              flutter build apk --release --split-per-abi \
                --dart-define=ORBITCARE_API_BASE_URL="${{ inputs.backend_url }}"
              ;;
          esac

      - name: List build outputs
        run: |
          ls -lh build/app/outputs/flutter-apk/ 2>/dev/null || true
          ls -lh build/app/outputs/bundle/release/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitcare-${{ inputs.artifact }}
          path: |
            Flutter/build/app/outputs/flutter-apk/*.apk
            Flutter/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
