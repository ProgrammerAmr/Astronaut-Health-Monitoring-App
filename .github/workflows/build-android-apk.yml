name: Build Signed Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Optional OrbitCare backend base URL baked into APK (also configurable in-app)"
        required: false
        default: ""
      release_tag:
        description: "GitHub Release tag for signed APK download"
        required: false
        default: "v1.0.0-apk"
  push:
    branches: [main, "arena/**"]
    paths:
      - "Flutter/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-apk:
    name: Build & Sign OrbitCare Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Prepare Android release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASS_SECRET: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="/tmp/orbitcare-release.jks"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
            KEY_ALIAS="${KEY_ALIAS_SECRET:-orbitcare}"
            KEY_PASS="$KEY_PASS_SECRET"
            STORE_PASS="$STORE_PASS_SECRET"
            echo "SIGNING_MODE=persistent-secret" >> "$GITHUB_ENV"
          else
            KEY_ALIAS="orbitcare-release"
            STORE_PASS=$(openssl rand -hex 16)
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=OrbitCare Prototype, OU=Hackathon, O=OrbitCare, L=Orbit, S=Space, C=EG"
            echo "SIGNING_MODE=ci-generated-release-key" >> "$GITHUB_ENV"
          fi

          cat > Flutter/android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

      - name: Fetch Flutter dependencies & run tests
        working-directory: Flutter
        run: |
          flutter pub get
          flutter test

      - name: Build signed release APK
        working-directory: Flutter
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
        run: |
          set -euo pipefail
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --release --dart-define="ORBITCARE_API_BASE_URL=$API_BASE_URL"
          else
            flutter build apk --release
          fi

      - name: Verify APK cryptographic signature & compute SHA-256
        run: |
          set -euo pipefail
          RAW_APK="Flutter/build/app/outputs/flutter-apk/app-release.apk"
          OUT_DIR="/tmp/orbitcare-release-assets"
          mkdir -p "$OUT_DIR"
          SIGNED_APK="$OUT_DIR/OrbitCare-v1.0.0-signed.apk"
          cp "$RAW_APK" "$SIGNED_APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls -d "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          else
            jarsigner -verify -verbose -certs "$SIGNED_APK"
          fi

          (cd "$OUT_DIR" && sha256sum OrbitCare-v1.0.0-signed.apk > OrbitCare-v1.0.0-signed.apk.sha256)
          cat "$OUT_DIR/OrbitCare-v1.0.0-signed.apk.sha256"
          ls -lh "$SIGNED_APK"

      - name: Clean up ephemeral signing credentials
        if: always()
        run: rm -f /tmp/orbitcare-release.jks Flutter/android/key.properties

      - name: Upload signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrbitCare-v1.0.0-signed-apk
          path: |
            /tmp/orbitcare-release-assets/OrbitCare-v1.0.0-signed.apk
            /tmp/orbitcare-release-assets/OrbitCare-v1.0.0-signed.apk.sha256
          retention-days: 30

      - name: Publish signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || 'v1.0.0-apk' }}
        run: |
          set -euo pipefail
          APK_PATH="/tmp/orbitcare-release-assets/OrbitCare-v1.0.0-signed.apk"
          SHA_PATH="/tmp/orbitcare-release-assets/OrbitCare-v1.0.0-signed.apk.sha256"
          SHA_VAL=$(awk '{print $1}' "$SHA_PATH")

          NOTES=$(cat <<EOF
          ## OrbitCare v1.0.0 — Signed Android APK (Hackathon Prototype)

          - **Application ID:** \`com.orbitcare.astronauthealth\`
          - **Signing mode:** \`${SIGNING_MODE}\` (verified with Android \`apksigner\`)
          - **SHA-256:** \`${SHA_VAL}\`
          - **Build commit:** \`${GITHUB_SHA}\`

          ### Installation & Server Setup on Mobile
          1. Download **OrbitCare-v1.0.0-signed.apk** on your Android device and allow **Install unknown apps** when prompted.
          2. Open **OrbitCare** -> go to the **Login** screen -> tap **Configure Server URL** to set your running OrbitCare backend URL (e.g. \`https://your-backend.example.com\` or \`http://<LAN-IP>:5000\`).

          > **Safety Notice:** Hackathon prototype only — not a clinical, diagnostic, or flight-certified system. DEC-001 Cognitive State Monitoring remains experimental and non-diagnostic.
          EOF
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" "$SHA_PATH" --clobber
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --notes "$NOTES" --prerelease
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" "$SHA_PATH" \
              --target "$GITHUB_SHA" \
              --title "OrbitCare v1.0.0 Signed Android APK" \
              --notes "$NOTES" \
              --prerelease
          fi
