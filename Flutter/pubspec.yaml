name: nasa
description: "OrbitCare Astronaut Health Monitoring hackathon prototype."
publish_to: "none"

version: 1.2.0+3

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_secure_storage: ^9.2.4
  # Cross-platform HTTP client (also powers Flutter Web, where dart:io is unavailable)
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
