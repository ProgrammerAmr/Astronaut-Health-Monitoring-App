name: Build Android App (APK)

# Manual build so the team can download an installable APK/AAB straight from
# GitHub without installing Flutter locally.
#
#   GitHub -> Actions -> "Build Android App (APK)" -> Run workflow
#     * backend_url : the OrbitCare API address baked into the app
#     * artifact    : apk-split (small, per CPU) / apk-universal / appbundle
#   When the run finishes, the download link is at the bottom of the run page
#   under "Artifacts".
#
# NOTE: GitHub only shows the "Run workflow" button once this file exists on the
#       default branch (main).

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL baked into the app (ORBITCARE_API_BASE_URL)"
        required: true
        default: "http://10.0.2.2:5000"
      artifact:
        description: "What to build"
        required: true
        default: "apk-split"
        type: choice
        options:
          - apk-split
          - apk-universal
          - appbundle
      flutter_channel:
        description: "Flutter channel"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.artifact }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android ${{ inputs.artifact }} (${{ inputs.backend_url }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Flutter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (AGP 9.x / Gradle 9.x toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: Accept Android SDK licenses and install platform packages
        shell: bash
        run: |
          set -x
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          # Gradle needs accepted licenses to auto-download a missing platform.
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed || true
          fi
          yes | flutter doctor --android-licenses || true

      - name: Report toolchain
        run: |
          java -version 2>&1 || true
          flutter --version || true
          flutter doctor -v || true

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Static analysis (fail before Gradle does)
        run: flutter analyze --no-fatal-infos

      - name: Use a CI-safe Gradle heap
        run: |
          # android/gradle.properties asks for -Xmx8G, which a hosted runner may
          # not be able to reserve. CI-only tweak; the repository is not changed.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m/' android/gradle.properties
          grep '^org.gradle.jvmargs' android/gradle.properties

      - name: Build release artifact
        shell: bash
        run: |
          set -o pipefail
          BUILD_CMD=""
          case "${{ inputs.artifact }}" in
            apk-universal)
              BUILD_CMD="flutter build apk --release --dart-define=ORBITCARE_API_BASE_URL=${{ inputs.backend_url }}"
              ;;
            appbundle)
              BUILD_CMD="flutter build appbundle --release --dart-define=ORBITCARE_API_BASE_URL=${{ inputs.backend_url }}"
              ;;
            *)
              BUILD_CMD="flutter build apk --release --split-per-abi --dart-define=ORBITCARE_API_BASE_URL=${{ inputs.backend_url }}"
              ;;
          esac
          echo "Running: $BUILD_CMD"
          $BUILD_CMD 2>&1 | tee /tmp/build.log

      - name: List build outputs
        run: |
          ls -lh build/app/outputs/flutter-apk/ 2>/dev/null || true
          ls -lh build/app/outputs/bundle/release/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbitcare-${{ inputs.artifact }}
          path: |
            Flutter/build/app/outputs/flutter-apk/*.apk
            Flutter/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # Maintainers cannot always open the run log (org restrictions, expired
      # logs). On failure, publish the useful tail of the build log as an issue
      # so it stays readable. Delete this step once the build is stable.
      - name: Publish failure diagnostics as an issue
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Android build failed"
            echo ""
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- artifact: \`${{ inputs.artifact }}\`"
            echo "- backend_url: \`${{ inputs.backend_url }}\`"
            echo ""
            echo "<details><summary>build log (tail)</summary>"
            echo ""
            echo '```'
            tail -n 150 /tmp/build.log 2>/dev/null || echo "(no build log captured)"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>flutter doctor -v</summary>"
            echo ""
            echo '```'
            flutter doctor -v 2>&1 | tail -n 60 || true
            echo '```'
            echo "</details>"
          } > /tmp/failure-report.md
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "APK build failed - run ${{ github.run_id }}" \
            --body-file /tmp/failure-report.md || true
